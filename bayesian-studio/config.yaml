name: "Bayesian Studio"
version: "0.4.11"
slug: "bayesian_studio"
description: "Visual interactive tuning UI for Bayesian binary sensors"
url: "https://github.com/maxlyth/ha-addon-bayesian-studio"
image: "ghcr.io/maxlyth/{arch}-bayesian-studio"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8501
panel_icon: "mdi:chart-bell-curve-cumulative"
panel_title: "Bayesian Studio"
homeassistant_api: true
map:
  - config:rw
options: {}
schema: {}
environment:
  PYTHONPATH: "/app"
  STREAMLIT_SERVER_PORT: "8501"
  STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
  STREAMLIT_SERVER_HEADLESS: "true"
  STREAMLIT_SERVER_ENABLE_CORS: "false"
  STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: "false"
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
  STREAMLIT_SERVER_RUN_ON_SAVE: "true"
  STREAMLIT_CLIENT_TOOLBAR_MODE: "minimal"
