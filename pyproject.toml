[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-studio"
version = "0.4.10"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest",
    "pyyaml",
    "jinja2",
    "sqlalchemy",
    "pymysql",
    "pg8000",
    "streamlit>=1.32",
    "plotly",
]

[tool.setuptools.packages.find]
where = ["bayesian-studio"]
include = ["bayesian_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["bayesian-studio"]
markers = [
    "integration: requires a live Home Assistant instance",
]
