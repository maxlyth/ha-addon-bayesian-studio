[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-studio"
version = "0.4.11"
description = "Visual interactive tuning UI for Home Assistant Bayesian binary sensors"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Max Lyth"}]
keywords = ["home-assistant", "bayesian", "binary-sensor", "tuning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "streamlit>=1.32",
    "plotly>=5.18",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pg8000>=1.30",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/maxlyth/ha-addon-bayesian-studio"
Repository = "https://github.com/maxlyth/ha-addon-bayesian-studio"
Issues = "https://github.com/maxlyth/ha-addon-bayesian-studio/issues"
Changelog = "https://github.com/maxlyth/ha-addon-bayesian-studio/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["bayesian-studio"]
include = ["bayesian_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["bayesian-studio"]
markers = [
    "integration: requires a live Home Assistant instance",
]
