[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-studio"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest",
    "pyyaml",
    "jinja2",
    "sqlalchemy",
    "pymysql",
    "pg8000",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bayesian_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live Home Assistant instance",
]
